name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a later push should win rather than interleave.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Vocabulary first: those files are the ones most likely to be edited by hand
      # or by a Claude session, and a bad edit would otherwise deploy cleanly and
      # then break the installed app offline, where it is hardest to diagnose.
      # This assembles the batches in memory, so it validates exactly what the
      # build will produce rather than a previously generated file.
      - name: Validate vocabulary
        run: npm run validate:vocab

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # vocab.json is generated, not committed — merged from public/data/cards/*.json.
      - name: Assemble vocabulary
        run: npm run build:vocab

      - name: Build
        run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Pull requests are validated but never published.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
